name: 治理校验与看板部署

on:
  push:
    branches: [master, main]
    paths:
      - '.trae/**'
      - 'dashboard/**'
  pull_request:
    paths:
      - '.trae/**'
      - 'dashboard/**'

permissions:
  contents: read
  pages: write
  id-token: write

# 同一时间只允许一个部署运行
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  check-and-generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装依赖
        run: pip install pyyaml

      - name: 运行治理一致性校验
        run: python dashboard/check-integrity.py

      - name: 校验结果摘要
        if: always()
        run: python dashboard/check-integrity.py --json 2>/dev/null | python -c "
import sys, json
try:
    d = json.load(sys.stdin)
    print(f'总计 {d[\"total\"]} 项 | 通过 {d[\"passed\"]} | 失败 {d[\"failed\"]} | 结果 {d[\"overall\"]}')
    for c in d['checks']:
        if not c['passed']:
            print(f'  FAIL: {c[\"name\"]} — {c[\"detail\"]}')
except: pass
"

      # 仅在 push 时生成静态看板（PR 不需要）
      - name: 生成静态看板
        if: github.event_name == 'push'
        run: python dashboard/generate-static.py

      - name: 准备 Pages 产物
        if: github.event_name == 'push'
        run: |
          mkdir -p pages-output
          cp dashboard/index.html pages-output/
          cp dashboard/status.json pages-output/
          cp dashboard/integrity.json pages-output/

      - name: 上传产物
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: pages-output
          path: pages-output
          retention-days: 1

  deploy-pages:
    needs: check-and-generate
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 下载产物
        uses: actions/download-artifact@v4
        with:
          name: pages-output
          path: pages-output

      - name: 配置 GitHub Pages
        uses: actions/configure-pages@v4

      - name: 上传 Pages 产物
        uses: actions/upload-pages-artifact@v3
        with:
          path: pages-output

      - name: 部署到 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
